name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag (for example, v3.23.0)
        required: true
        type: string
      overwrite:
        description: Overwrite an existing GitHub Release and its assets
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        description: Release version or tag (for example, v3.23.0)
        required: true
        type: string
      overwrite:
        description: Overwrite an existing GitHub Release and its assets
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Normalize version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $INPUT_VERSION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build-dist:
    needs: prepare-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        font:
          - { key: all, suffix: '' }
          - { key: cdn, suffix: '-cdn-fonts' }
          - { key: firasans, suffix: '-firasans-only' }
          - { key: misans, suffix: '-misans-only' }
          - { key: pingfang, suffix: '-pingfang-only' }
          - { key: sarasa, suffix: '-sarasa-only' }
          - { key: none, suffix: '-no-fonts' }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - uses: pnpm/action-setup@v6

      - name: Build and Zip the dist folder
        env:
          FONT: ${{ matrix.font.key }}
          VERSION: ${{ needs.prepare-version.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          pnpm i
          pnpm run build
          zip -r dist${{ matrix.font.suffix }}.zip dist

      - name: Build ShellCrash archive
        if: matrix.font.key == 'all'
        run: |
          find dist -type f \( -name '*.ttf' -o -name '*.woff' -o -name '*.woff2' \) -delete
          printf '%s\n' 'board.zash.run.place' > dist/CNAME
          tar -czf zashboard.tar.gz -C dist .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.font.key }}
          path: |
            dist${{ matrix.font.suffix }}.zip
            zashboard.tar.gz

  publish-release:
    needs: [prepare-version, build-dist]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Check existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-version.outputs.tag }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [[ "$OVERWRITE" != "true" ]]; then
            echo "Release $TAG already exists. Set overwrite=true to replace it."
            exit 1
          fi

      - name: Publish release and assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist*.zip
            zashboard.tar.gz
          tag_name: ${{ needs.prepare-version.outputs.tag }}
          name: ${{ needs.prepare-version.outputs.tag }}
          generate_release_notes: true
          overwrite_files: ${{ inputs.overwrite }}
