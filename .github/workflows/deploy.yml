name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag (for example, v3.23.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true

  release-dist:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        font:
          - { key: all, suffix: '' }
          - { key: cdn, suffix: '-cdn-fonts' }
          - { key: firasans, suffix: '-firasans-only' }
          - { key: misans, suffix: '-misans-only' }
          - { key: pingfang, suffix: '-pingfang-only' }
          - { key: sarasa, suffix: '-sarasa-only' }
          - { key: none, suffix: '-no-fonts' }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - uses: pnpm/action-setup@v6

      - name: Build and Zip the dist folder
        env:
          FONT: ${{ matrix.font.key }}
        run: |
          pnpm i
          pnpm version "${{ inputs.version }}" --no-git-tag-version
          pnpm run build
          zip -r dist${{ matrix.font.suffix }}.zip dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist${{ matrix.font.suffix }}.zip
          tag_name: ${{ inputs.version }}
